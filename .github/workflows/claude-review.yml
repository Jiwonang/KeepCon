name: Claude PR Review

# PR이 열리거나 갱신되면 Claude가 KeepCon 협업 규칙 준수 여부와 버그를 리뷰한다.
# ANTHROPIC_API_KEY 시크릿이 설정돼 있어야 동작한다(없으면 리뷰 단계를 건너뛰고 통과).
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    # 시크릿 유무를 job env로 판별해, 미설정 시 리뷰 단계를 건너뛰고 CI는 통과시킨다.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 Pull Request를 한국어로 리뷰해줘. KeepCon(Flutter, Riverpod) 프로젝트의
            협업 규칙 준수를 중점적으로 확인하고, 근거를 `파일:라인`으로 제시해줘.

            확인 항목:
            - 공유 모델·인터페이스·enum·라우트·테마를 `lib/shared/`의 단일 정의로 사용하는지
              (페이지 내부에서 재정의하지 않았는지)
            - Repository 메서드를 계약(abstract 인터페이스)의 이름·파라미터 그대로 호출하는지
              (추측 호출/오타 없는지)
            - 상태·정렬·필터에 매직 스트링 대신 계약의 enum을 쓰는지
            - 색상·폰트·모양을 하드코딩하지 않고 `Theme.of(context)` 토큰을 소비하는지
            - 페이지 간 경계면 불일치(생산자/소비자 shape·필드·상태전이) 가능성
            - 일반적인 버그·엣지케이스·네이밍·널 안전성

            심각한 문제부터 순서대로, 구체적 수정 방법과 함께 제시해줘.
            문제가 없으면 간단한 승인 코멘트를 남겨줘.

      - name: Skipped notice
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다. (Settings → Secrets → Actions 에서 추가)"
