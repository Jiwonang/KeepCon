name: CI

# develop·main 대상 PR과 push에서 포맷·정적분석·테스트를 검증한다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에서 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 공유 계약(lib/shared) 타입·provider를 lib/features에서 재정의/재선언하지 못하게 막는다.
      # analyze는 "잘못된 호출"만 잡고 "로컬 재정의"는 통과시키므로, 이 가드가 SSOT를 강제한다.
      - name: SSOT guard
        run: bash tool/check_ssot.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
