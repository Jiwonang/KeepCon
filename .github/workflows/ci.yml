name: CI

# develop·main 대상 PR과 push에서 포맷·정적분석·테스트를 검증한다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에서 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 공유 계약(lib/shared) 타입·provider를 lib/features에서 재정의/재선언하지 못하게 막는다.
      # analyze는 "잘못된 호출"만 잡고 "로컬 재정의"는 통과시키므로, 이 가드가 SSOT를 강제한다.
      - name: SSOT guard
        run: bash tool/check_ssot.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `firestore.rules`는 배포 전까지 "문법만 맞는 문서"이고, 규칙 계층의 결함은
      # Dart 테스트가 원리상 잡지 못한다(테스트는 in-memory 구현을 쓴다). 실제로
      # 비멤버가 초대 없이 그룹에 합류하고 스스로 방장 role을 써넣을 수 있는 구멍이
      # 이 방식으로만 드러났다. 그래서 에뮬레이터에 규칙을 걸고 실제 요청을 보낸다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Firestore 에뮬레이터는 JVM에서 돈다.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # demo- 접두 프로젝트라 자격증명 없이 뜬다.
      - name: Verify firestore.rules
        run: >-
          firebase emulators:exec --project demo-keepcon --only auth,firestore
          "bash tool/verify_firestore_rules.sh"
