name: keepcon
description: 흩어진 기프티콘을 한 곳에서 관리·보관·공유하는 Flutter 앱.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 프로젝트 전역 표준 상태관리(오케스트레이터 지정).
  flutter_riverpod: ^2.5.1
  # Firebase 데이터 계층(선택적 백엔드). 기본 실행은 in-memory 유지 —
  # 이 패키지들은 lib/shared/repositories/impl/firebase/ 구현체가 사용하며,
  # 부트스트랩으로 명시적으로 전환하기 전에는 초기화되지 않는다.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
