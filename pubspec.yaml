name: keepcon
description: 흩어진 기프티콘을 한 곳에서 관리·보관·공유하는 Flutter 앱.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_barcode_scanning: ^0.13.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.0
  google_mlkit_commons: ^0.9.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_links: ^7.2.1
  share_plus: ^13.3.0
  barcode_widget: ^2.0.4

  # 자소 클러스터 단위 문자열 순회(String.characters).
  #
  # flutter가 이미 같은 버전을 끌어오지만 **직접 쓰므로 직접 선언한다** —
  # 선언하지 않으면 `depend_on_referenced_packages` lint에 걸리고, 전이 의존성은
  # 상위 패키지 사정으로 사라질 수 있다.
  characters: ^1.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true